name: Xcode

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: >-
          xcodebuild build
          -project Quizie.xcodeproj
          -scheme Quizie
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project Quizie.xcodeproj
          -scheme Quizie
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -only-testing:QuizieTests
          CODE_SIGNING_ALLOWED=NO
